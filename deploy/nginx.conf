# Linux Atlas — Nginx 站点配置
# 使用前把「你的域名」替换为真实域名

server {
    listen 80;
    listen [::]:80;
    server_name 你的域名 www.你的域名;

    # certbot 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP 全部跳转 HTTPS（证书签发后启用）
    # return 301 https://$host$request_uri;
}

